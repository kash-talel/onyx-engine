name: ONYX Engine CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test-and-lint:
    name: Backend Tests, Linting & NLP Benchmark
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio hypothesis httpx
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e onyx-core/
          pip install -e onyx-nlp/
          pip install -e onyx-api/

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check onyx-core onyx-api onyx-nlp onyx-crawlers scripts --ignore E501,F401,F841,B008,E712

      - name: Run Core Domain Unit Tests (Decay & Confidence Scoring)
        run: |
          cd onyx-core && python -m pytest tests/unit -v

      - name: Run FastAPI Health & Contract Tests
        run: |
          cd onyx-api && python -m pytest tests/ -v

      - name: Execute Quantitative NLP Benchmark Evaluation
        run: |
          python onyx-nlp/evaluate_benchmarks.py

  frontend-typecheck-and-lint:
    name: Frontend Typecheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: onyx-dashboard/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: onyx-dashboard
        run: npm ci

      - name: TypeScript Type-Check (Strict Mode)
        working-directory: onyx-dashboard
        run: npx tsc --noEmit
